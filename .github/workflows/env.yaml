name: Test banana interpolation
on:
  workflow_dispatch:

jobs:
  banana:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pver: ['3.13', '3.14']

    env:
      BANANA: hello I am banana

    steps:
      - name: Set env var
        env:
          CARROT: ${{ matrix.pver == '3.14' }}
        run: |
          env | sort

      - run: |
          echo "BANANA=$BANANA" >> $GITHUB_ENV

      - run: |
          echo docker build $BANANA fred
